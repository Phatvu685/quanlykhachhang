services:
  - type: web
    name: quanlykhachhang-api
    runtime: node
    region: singapore
    plan: free
    rootDir: customer-crm-backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && node prisma/seed-runtime.js && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: quanlykhachhang
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: quanlykhachhang
    runtime: node
    region: singapore
    plan: free
    rootDir: customer-crm-nextjs
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: quanlykhachhang-api
          envVarKey: RENDER_EXTERNAL_URL
